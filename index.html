<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GB Railway Map</title>
</head>

<body>
  <div id="map" style="height: 100vh"></div>
  <script type="module" src="/src/main.js"></script>

  <div id="buttons">
    <button id="geo-button" class="active">Geographic distance</button>
    <button id="track-button">Distance along track</button>
  </div>

  <div id="distance-box">
    <p>From: <span id="from"></span></p>
    <p>To: <span id="to"></span></p>
    <p>Geographic distance: <span id="geographic"></span></p>
    <p>Track distance: <span id="track"></span></p>
  </div>


  <div id="search">
    <input id="search-box" type="text" placeholder="Search station">
  </div>
</body>

</html>
